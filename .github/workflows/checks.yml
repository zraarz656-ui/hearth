name: checks

# The pre-commit hook in .githooks/ catches a broken phase document on the
# machine that made it, but only if that machine installed the hook. This
# workflow is the backstop for a clone that never ran
# `git config core.hooksPath .githooks`, and for a commit made with --no-verify.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phase-documentation:
    name: phase documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check cross-references commit subjects to find a phase missing
          # from the *end* of the document, which contiguity cannot see. A
          # shallow clone hides that history and silently weakens the check.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check phase documentation
        run: python3 tools/check_phase_reports.py

      - name: Test the check itself
        run: python3 -m unittest discover -s tools/tests -t . -v

  dataset-tools:
    name: dataset tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test the Dukascopy tooling
        run: python3 -m unittest discover -s tools/dukascopy/tests -t .

  android:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install the SDK platform the build pins
        # compileSdk is 36. setup-android does not install a platform by
        # default, and AGP's auto-download is disabled on CI runners, so this
        # is explicit rather than left to fail on a missing platform.
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Compile release
        run: ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Lint
        # Lint is allowed to fail the build only on errors, not warnings.
        # The tree carries a 19-warning baseline; failing on warnings would make
        # this job red for reasons unrelated to the change under review.
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
